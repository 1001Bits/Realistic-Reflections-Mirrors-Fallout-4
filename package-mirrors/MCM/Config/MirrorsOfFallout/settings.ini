[Mirrors]
; This file is the DEFAULTS. The menu writes the player's choices to
; Data\MCM\Settings\MirrorsOfFallout.ini, which is read over the top of it.
;
; The menu carries the same controls as the Skyrim mod's Placed Mirrors page, in the same order. The keys
; below that the menu no longer shows are kept only so an existing INI keeps working; they are not part of
; the supported settings and the defaults here are the values the mod is tuned for.

; Quality mode: 0 = Automatic, 1 = Preset, 2 = Manual (the menu's option order).
; Existing two-switch user settings are recognized until the selector is saved.
iQualityMode=1
; Automatic pressure order: 2048/60 Hz, 1024/60 Hz, 1024/30 Hz, 512/30 Hz.
; Resolution trials must improve frame times; otherwise restore detail (2048/30 Hz fallback).
; Pressure tiers cap scene distance and use Low shadows; saved choices are preserved.
; Nearby moving mirrors use the same cadence as Low. Automatic/presets reduce small distant panes to 30/15 Hz.
; Target game frame rate for automatic adjustment (30-144); quality limits take priority.
iAutomaticTargetFPS=60
; 0 = Low, 1 = Medium, 2 = High.
iQualityLevel=1
; Resolution choice: 0=default (4096 for every mirror), 1=512, 2=1024, 3=2048, 4=4096.
iResolution=0
; Capture every game frame instead of at the rate below.
bEveryFrameRefresh=0
; Target updates per second (5-180). Several mirrors in a room share the available captures.
iRefreshRate=60
; Manual mode: all reflection shadows on/off. Presets use their own shadow policy.
bShadows=1
; How far from each mirror objects are drawn into the reflection, in game units (500-5000).
iOutdoorDistance=2000
; How far from each mirror shadows are cast, in game units (500-5000).
iShadowDistance=2000

; --- Not in the menu. Kept for INI compatibility; leave these alone. ---
; Former switches: upgrade fallback when the user has no iQualityMode.
; bAutomaticQuality also remembers whether Automatic uses preset or manual scene settings.
bAutomaticQuality=1
bAutomaticQualityAdjustment=0
; Legacy light-budget choice; all choices now use the 256-light ceiling.
iLightBudget=2
; Player receiving shadows always follow the reflection shadow policy.
; Legacy bPlayerShadows and bPlayerSunlightShadows values are ignored.
bSmallObjectShadows=0
; Restrict private sunlight maps and the player mask to exterior cells.
bSunlightShadowsOutdoorsOnly=0
; Apply the object distance above outdoors.
bLimitedOutdoorRange=1
; Both sunlight shadow maps use this resolution (512-4096 in steps of 512).
iShadowResolution=2048
; Percent of full sunlight below which sun shadow maps are skipped.
iMinimumSunLight=15
; Debug keys: F7 optimisations on/off, F8 benchmark, F11 performance overlay, F12 reflections on/off.
bDebugKeys=0
